<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hama Dev - Roblox Codes</title>
    <!-- گرتنی QR کۆد لە لایبریری دەرەکی -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #10b981;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
        }
        h1, h2 {
            margin-bottom: 20px;
            color: #818cf8;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: var(--primary);
            outline: none;
        }
        button {
            background: var(--primary);
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: var(--primary-dark);
        }
        .hidden {
            display: none !important;
        }
        .error {
            color: #ef4444;
            font-size: 14px;
            margin-top: 5px;
        }
        .success {
            color: var(--accent);
            font-size: 14px;
            margin-top: 5px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .code-item {
            background: #0f172a;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-panel {
            border-top: 2px dashed #334155;
            margin-top: 20px;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- بەشی چوونەژوورەوە (Login) -->
        <div id="login-section">
            <h1>Hama Dev Arena</h1>
            <p>تکایە ناوی بەکارهێنەر و وشەی نەێنی بنووسە</p>
            <input type="text" id="username" placeholder="ناوی بەکارهێنەر (بۆ نموونە: hama dev)">
            <input type="password" id="password" placeholder="وشەی نەێنی (Password)">
            <button onclick="login()">چوونەژوورەوە</button>
            <div id="login-error" class="error"></div>
            
            <hr style="margin: 20px 0; border-color: #334155;">
            <button onclick="toggleQR()" style="background: #334155;">چوونەژوورەوە بە QR کۆد</button>
            <div id="qr-container" class="hidden">
                <p style="font-size: 13px; margin: 5px 0;">ئەم QR کۆدە سکان بکە بۆ چوونەژوورەوەی خێرا:</p>
                <div id="qrcode"></div>
            </div>
        </div>

        <!-- بەشی یاری و کۆد لێدان (Game & Redemption) -->
        <div id="game-section" class="hidden">
            <h2 id="welcome-msg"></h2>
            <p>کۆدی ڕۆبۆکس لێرە بنووسە بۆ وەرگرتنی دیارییەکەت!</p>
            <input type="text" id="user-code" placeholder="کۆدەکان لێرە بنووسە...">
            <button onclick="redeemCode()">لێدانی کۆد (Redeem)</button>
            <div id="redeem-msg"></div>

            <!-- بەشی زیادکردنی کۆد تەنها بۆ خاوەن ماڵپەڕ (Hama Dev) -->
            <div id="admin-section" class="admin-panel hidden">
                <h3>پەنێڵی بەڕێوەبەر (Hama Dev)</h3>
                <input type="text" id="new-robux-code" placeholder="کۆدی نوێی ڕۆبۆکس...">
                <button onclick="addNewCode()" style="background: var(--accent);">زیادکردنی کۆدی نوێ</button>
                <div id="admin-msg" class="success"></div>
            </div>

            <button onclick="logout()" style="background: #ef4444; margin-top: 20px;">چوونەدەرەوە</button>
        </div>
    </div>

    <script>
        // کۆدە سەرەتاییەکانی ڕۆبۆکس لە ناو سیستەمدا
        let robuxCodes = JSON.parse(localStorage.getItem('hama_codes')) || ["ROBLOX2026", "HAMADEV100", "FREE_ROBUX"];

        // دروستکردنی QR کۆد بۆ چوونەژوورەوە
        new QRCode(document.getElementById("qrcode"), {
            text: "HamaDev_Login_Verified_2019",
            width: 128,
            height: 128
        });

        function toggleQR() {
            const qrDiv = document.getElementById('qr-container');
            qrDiv.classList.toggle('hidden');
        }

        function login() {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('login-error');

            // پێکهێنانی مەرجی چوونەژوورەوە
            if (user === 'hama dev' && pass === '2019') {
                // ئەگەر خۆت بوویت (Admin)
                sessionStorage.setItem('role', 'admin');
                sessionStorage.setItem('user', 'Hama Dev');
                startApp('admin');
            } else if (user !== '' && pass === '2019') {
                // ئەگەر بەکارهێنەری ئاسایی بوو
                sessionStorage.setItem('role', 'user');
                sessionStorage.setItem('user', user);
                startApp('user');
            } else {
                errorDiv.innerText = "ناوی بەکارهێنەر یاخود وشەی نەێنی (2019) هەڵەیە!";
            }
        }

        function startApp(role) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            
            const username = sessionStorage.getItem('user');
            document.getElementById('welcome-msg').innerText = `بەخێر هاتیت، ${username}!`;

            if (role === 'admin') {
                document.getElementById('admin-section').classList.remove('hidden');
            } else {
                document.getElementById('admin-section').classList.add('hidden');
            }
        }

        function redeemCode() {
            const codeInput = document.getElementById('user-code').value.trim();
            const msgDiv = document.getElementById('redeem-msg');

            if (!codeInput) {
                msgDiv.innerHTML = '<span class="error">تکایە کۆدێک بنووسە!</span>';
                return;
            }

            const index = robuxCodes.indexOf(codeInput);
            if (index !== -1) {
                // کۆدەکە ڕاستە و بەکارهێنرا، دەسڕدرێتەوە تا دووبارە نەبێتەوە
                robuxCodes.splice(index, 1);
                localStorage.setItem('hama_codes', JSON.stringify(robuxCodes));
                msgDiv.innerHTML = '<span class="success">🎉 پیرۆزە! کۆدەکە سەرکەوتوو بوو، ڕۆبۆکسەکە گەیشت!</span>';
            } else {
                msgDiv.innerHTML = '<span class="error">❌ کۆدەکە هەڵەیە یان پێشتر بەکارهاتووە!</span>';
            }
            document.getElementById('user-code').value = '';
        }

        function addNewCode() {
            const newCode = document.getElementById('new-robux-code').value.trim();
            const adminMsg = document.getElementById('admin-msg');

            if (newCode) {
                robuxCodes.push(newCode);
                localStorage.setItem('hama_codes', JSON.stringify(robuxCodes));
                adminMsg.innerText = "کۆدی نوێ بە سەرکەوتوویی زیادکرا!";
                document.getElementById('new-robux-code').value = '';
                setTimeout(() => { adminMsg.innerText = ''; }, 3000);
            }
        }

        function logout() {
            sessionStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
