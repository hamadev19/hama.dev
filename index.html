<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hama Dev - Roblox Codes</title>
    <!-- لایبریری QR و لایبریری وێنەگرتنی شاشە (html2canvas) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #10b981;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
        }
        h1, h2 {
            margin-bottom: 20px;
            color: #818cf8;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: var(--primary);
            outline: none;
        }
        button {
            background: var(--primary);
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: var(--primary-dark);
        }
        .hidden {
            display: none !important;
        }
        .error {
            color: #ef4444;
            font-size: 14px;
            margin-top: 5px;
        }
        .success {
            color: var(--accent);
            font-size: 15px;
            margin-top: 10px;
            line-height: 1.6;
            background: rgba(16, 185, 129, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--accent);
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .admin-panel {
            border-top: 2px dashed #334155;
            margin-top: 20px;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="capture-area">
        <!-- بەشی چوونەژوورەوە -->
        <div id="login-section">
            <h1>Hama Dev Arena</h1>
            <p>ناوی خۆت بنووسە بۆ چوونەژوورەوە</p>
            <input type="text" id="username" placeholder="ناوی بەکارهێنەر (بۆ نموونە: hama dev)">
            <input type="password" id="password" placeholder="پاسپۆرد (هەر پاسپۆردێک بێت)">
            <button onclick="login()">چوونەژوورەوە</button>
            <div id="login-error" class="error"></div>
            
            <hr style="margin: 20px 0; border-color: #334155;">
            <button onclick="toggleQR()" style="background: #334155;">چوونەژوورەوە بە QR کۆد</button>
            <div id="qr-container" class="hidden">
                <p style="font-size: 13px; margin: 5px 0;">QR کۆدی چوونەژوورەوەی خێرا:</p>
                <div id="qrcode"></div>
                <button onclick="qrLogin()" style="background: var(--accent); margin-top: 5px;">چوونەژوورەوە لەڕێگەی QR</button>
            </div>
        </div>

        <!-- بەشی یاری و کۆد لێدان -->
        <div id="game-section" class="hidden">
            <h2 id="welcome-msg"></h2>
            <p>کۆدی ڕۆبۆکس لێرە بنووسە بۆ وەرگرتنی خەڵاتەکەت!</p>
            <input type="text" id="user-code" placeholder="کۆدەکان لێرە بنووسە...">
            <button onclick="redeemCode()">لێدانی کۆد (Redeem)</button>
            <div id="redeem-msg"></div>

            <!-- بەشی زیادکردنی کۆد تەنها بۆ خاوەن ماڵپەڕ (Hama Dev) -->
            <div id="admin-section" class="admin-panel hidden">
                <h3>پەنێڵی بەڕێوەبەر (Hama Dev)</h3>
                <input type="text" id="new-robux-code" placeholder="کۆدی نوێی ڕۆبۆکس...">
                <button onclick="addNewCode()" style="background: var(--accent);">زیادکردنی کۆدی نوێ</button>
                <div id="admin-msg" class="success" style="background:none; border:none;"></div>
            </div>

            <button onclick="logout()" style="background: #ef4444; margin-top: 20px;">چوونەدەرەوە</button>
        </div>
    </div>

    <script>
        // کۆدە سەرەتاییەکانی ڕۆبۆکس
        let robuxCodes = JSON.parse(localStorage.getItem('hama_codes')) || ["ROBLOX2026", "HAMADEV100", "FREE_ROBUX"];

        // دروستکردنی QR کۆد
        new QRCode(document.getElementById("qrcode"), {
            text: "HamaDev_QR_User_Verified",
            width: 128,
            height: 128
        });

        function toggleQR() {
            const qrDiv = document.getElementById('qr-container');
            qrDiv.classList.toggle('hidden');
        }

        function qrLogin() {
            sessionStorage.setItem('role', 'user');
            sessionStorage.setItem('user', 'QR_Player');
            startApp('user');
        }

        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('login-error');

            if (!user || !pass) {
                errorDiv.innerText = "تکایە ناو و پاسپۆرد بنووسە!";
                return;
            }

            // ئەگەر ناوی hama dev بوو ئەوا دەبێتە ئەدمین (خاوەن یاری)
            if (user.toLowerCase() === 'hama dev') {
                sessionStorage.setItem('role', 'admin');
                sessionStorage.setItem('user', 'Hama Dev');
                startApp('admin');
            } else {
                // بەکارهێنەری ئاسایی بە هەر پاسپۆردێک
                sessionStorage.setItem('role', 'user');
                sessionStorage.setItem('user', user);
                startApp('user');
            }
        }

        function startApp(role) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            
            const username = sessionStorage.getItem('user');
            document.getElementById('welcome-msg').innerText = `بەخێر هاتیت، ${username}!`;

            if (role === 'admin') {
                document.getElementById('admin-section').classList.remove('hidden');
            } else {
                document.getElementById('admin-section').classList.add('hidden');
            }
        }

        function redeemCode() {
            const codeInput = document.getElementById('user-code').value.trim();
            const msgDiv = document.getElementById('redeem-msg');

            if (!codeInput) {
                msgDiv.innerHTML = '<span class="error">تکایە کۆدێک بنووسە!</span>';
                return;
            }

            const index = robuxCodes.indexOf(codeInput);
            if (index !== -1) {
                // کۆدەکە ڕاستە، دەسڕدرێتەوە
                robuxCodes.splice(index, 1);
                localStorage.setItem('hama_codes', JSON.stringify(robuxCodes));
                
                // نیشاندانی پەیامی سەرکەوتن و داوای ڕەسم ناردن
                msgDiv.innerHTML = `
                    <div class="success">
                        🎉 <strong>پیرۆزت بێت!</strong> کۆدەکە ڕاستە.<br>
                        📸 <em>وێنەی ئەم شاشەیە بگرە (Screenshot) و ڕەسمەکە بۆ Hama Dev بنێرە بۆ وەرگرتنی خەڵاتەکەت!</em>
                    </div>
                `;

                // بە شێوازی خۆکارانەش ڕەسمی شاشەکە (Screenshot) دەگرێت و دەیبەخشێت بە بەکارهێنەر بۆ داگرتن
                setTimeout(() => {
                    html2canvas(document.getElementById('capture-area')).then(canvas => {
                        let link = document.createElement('a');
                        link.download = 'HamaDev-Reward.png';
                        link.href = canvas.toDataURL();
                        link.click();
                    });
                }, 1000);

            } else {
                msgDiv.innerHTML = '<span class="error">❌ کۆدەکە هەڵەیە یان پێشتر بەکارهاتووە!</span>';
            }
            document.getElementById('user-code').value = '';
        }

        function addNewCode() {
            const newCode = document.getElementById('new-robux-code').value.trim();
            const adminMsg = document.getElementById('admin-msg');

            if (newCode) {
                robuxCodes.push(newCode);
                localStorage.setItem('hama_codes', JSON.stringify(robuxCodes));
                adminMsg.innerText = "کۆدی نوێ بە سەرکەوتوویی زیادکرا!";
                document.getElementById('new-robux-code').value = '';
                setTimeout(() => { adminMsg.innerText = ''; }, 3000);
            }
        }

        function logout() {
            sessionStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
